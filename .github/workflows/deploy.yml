name: Deploy to PHP Hosting

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Kéo code từ GitHub
      uses: actions/checkout@v3

    - name: Đồng bộ code lên Hosting qua FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftpupload.net
        username: if0_43453392
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/
